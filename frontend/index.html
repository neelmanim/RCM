    <script>
        // ── Sidebar fixed-position tooltip (escapes overflow:hidden on .app-container) ──
        // CSS ::after tooltips are clipped; we drive a fixed <div> instead.
        (function initSidebarTooltip() {
            const tip = document.getElementById('sidebar-tooltip');
            const sidebar = document.getElementById('app-sidebar');
            if (!tip || !sidebar) return;

            let hideTimer = null;

            sidebar.addEventListener('mouseenter', (e) => {
                const link = e.target.closest('.sidebar-nav a[data-tooltip]');
                if (!link) return;
                // Only show when collapsed
                if (!sidebar.classList.contains('sidebar-collapsed')) return;

                const label = link.getAttribute('data-tooltip');
                if (!label) return;

                clearTimeout(hideTimer);
                const rect = link.getBoundingClientRect();
                tip.textContent = label;
                tip.style.left = (rect.right + 12) + 'px';
                tip.style.top = (rect.top + rect.height / 2) + 'px';
                tip.style.transform = 'translateY(-50%)';
                tip.classList.add('visible');
            }, true);

            sidebar.addEventListener('mouseleave', (e) => {
                const link = e.target.closest('.sidebar-nav a[data-tooltip]');
                if (!link) return;
                hideTimer = setTimeout(() => tip.classList.remove('visible'), 80);
            }, true);

            // Also hide when clicking a link
            sidebar.addEventListener('click', () => tip.classList.remove('visible'), true);
        })();
    </script>
