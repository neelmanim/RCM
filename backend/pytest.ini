[pytest]
testpaths = tests
pythonpath = . tests
# Parallel across all cores (pytest-xdist): 8m23s → 2m28s on 8 cores, same
# results. Every test gets its own in-memory SQLite engine, so workers never
# share state. Debug a single test serially with `-n0`.
addopts = -n auto

# ── Test environment ──────────────────────────────────────────────────────────
# JWT_SECRET is required by auth.py at import time. Provide a fixed test value
# so `pytest` works without any env var prefix.
env =
    JWT_SECRET=test-secret-for-pytest-only
    DATABASE_URL=sqlite:///./test_crm.db

# ── Warning filters ───────────────────────────────────────────────────────────
# Suppress known third-party deprecation noise that we cannot fix ourselves.
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:fastapi.*
    ignore::PendingDeprecationWarning:starlette.*
    ignore::urllib3.exceptions.NotOpenSSLWarning
    ignore::sqlalchemy.exc.SAWarning
    ignore:urllib3 v2 only supports OpenSSL:Warning

# ── xfail behaviour ──────────────────────────────────────────────────────────
# Tests marked xfail that now pass are reported as XPASS (warnings, not errors).
# Set xfail_strict=true per-test (via @pytest.mark.xfail(strict=True)) when
# you want XPASS to be treated as a hard failure.
xfail_strict = false
